<section class="clients-panel" aria-label="Список клиентов">
    <form method="get" action="{% url 'clients:list' %}" class="clients-filters">
        <div class="mb-2">
            <label class="form-label" for="client-name">Имя</label>
            <input class="form-control" id="client-name" name="client_name" value="{{ filter_name }}">
        </div>
        <div class="mb-2">
            <label class="form-label" for="client-phone">Телефон</label>
            <input class="form-control" id="client-phone" name="client_phone" value="{{ filter_phone }}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="client-vin">VIN</label>
            <input class="form-control" id="client-vin" name="vin" value="{{ filter_vin }}">
        </div>
        <button class="btn btn-primary" type="submit">Применить</button>
        <a class="btn btn-outline-secondary" href="{% url 'clients:list' %}">Очистить</a>
    </form>

    <div class="clients-results" aria-live="polite">
        {% for listed_client in clients %}
            <div class="client-row{% if listed_client.pk == client.pk %} active{% endif %}">
                <a href="{% url 'clients:details' listed_client.pk %}{% querystring %}"
                   {% if listed_client.pk == client.pk %}aria-current="page"{% endif %}>
                    {{ listed_client.name }}
                </a>
            </div>
        {% empty %}
            <p class="p-3 mb-0 text-muted">Клиенты не найдены.</p>
        {% endfor %}
    </div>
</section>

<script>
    (() => {
        const nameInput = document.getElementById('client-name');
        const results = document.querySelector('.clients-results');
        if (!nameInput || !results) return;

        const rows = Array.from(results.querySelectorAll('.client-row'));
        let emptyMessage = results.querySelector('.clients-empty-message, p');
        if (emptyMessage) emptyMessage.classList.add('clients-empty-message');

        nameInput.addEventListener('input', () => {
            const query = nameInput.value.trim().toLocaleLowerCase();
            let visibleCount = 0;

            rows.forEach((row) => {
                const name = row.querySelector('a').textContent.trim().toLocaleLowerCase();
                const matches = name.includes(query);
                row.hidden = !matches;
                if (matches) visibleCount += 1;
            });

            if (visibleCount === 0) {
                if (!emptyMessage) {
                    emptyMessage = document.createElement('p');
                    emptyMessage.className = 'p-3 mb-0 text-muted clients-empty-message';
                    emptyMessage.textContent = 'Клиенты не найдены.';
                    results.append(emptyMessage);
                }
                emptyMessage.hidden = false;
            } else if (emptyMessage) {
                emptyMessage.hidden = true;
            }
        });
    })();
</script>
